<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAC Bears - VEX Pushback 25-26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Alata&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Good Times';
        src: url('/fonts/good-times-rg.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Glacial Indifference';
        src: url('/fonts/glacial-indifference-400.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Glacial Indifference';
        src: url('/fonts/glacial-indifference-700.woff') format('woff');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --paper:    #FFFFFF;
        --mist:     #F3F4F6;
        --ink:      #0E1116;
        --ink-2:    #4B535E;

        /* Loud, flat, competition-poster colour: black, purple, yellow */
        --flame:    #6519E0;   /* the team's own signal colour */
        --electric: #0E1116;   /* deep black field */
        --amber:    #FFC400;   /* yellow — only ever on a dark ground */

        /* Accessible text version on white */
        --flame-tx: #5815C2;
      }

      * { -webkit-font-smoothing: antialiased; }

      body {
        font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-variation-settings: 'wdth' 100;
        background-color: var(--paper);
        color: var(--ink);
      }

      /* Poster-scale display: wide, heavy, tightly set */
      /* Headings — Good Times */
      .t-mega {
        font-family: 'Good Times', 'Archivo', system-ui, sans-serif;
        font-variation-settings: normal;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 0.95;
        text-transform: uppercase;
      }

      /* The team name only — Good Times, a wide techno face */
      .t-brand {
        font-family: 'Good Times', 'Archivo', system-ui, sans-serif;
        font-variation-settings: normal;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 0.9;
        text-transform: uppercase;
      }

      /* Sub-headings, labels and figures — Alata (single weight) */
      .t-head {
        font-family: 'Alata', 'Archivo', system-ui, sans-serif;
        font-variation-settings: normal;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.0;
      }

      .t-sub {
        font-family: 'Alata', 'Archivo', system-ui, sans-serif;
        font-variation-settings: normal;
        font-weight: 400;
        letter-spacing: -0.015em;
        line-height: 1.15;
      }

      .t-meta {
        font-family: 'Alata', 'Archivo', system-ui, sans-serif;
        font-variation-settings: normal;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .t-fig {
        font-family: 'Alata', 'Archivo', system-ui, sans-serif;
        font-variation-settings: normal;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        line-height: 0.8;
      }

      p { text-wrap: pretty; }
      h1, h2, h3 { text-wrap: balance; }

      /* Type that runs past its own box, the way a printed poster crops */
      .bleed-left { margin-left: -0.055em; }

      .hatch {
        background-color: var(--mist);
        background-image: repeating-linear-gradient(
          -45deg, transparent 0 9px, rgba(14, 17, 22, 0.07) 9px 11px
        );
      }

      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      :focus-visible { outline: 3px solid var(--electric); outline-offset: 2px; }
      .on-colour :focus-visible { outline-color: #FFFFFF; }

      /* One orchestrated entrance, nothing else moves on its own */
      @keyframes rise {
        from { opacity: 0; transform: translateY(26px); }
        to   { opacity: 1; transform: none; }
      }
      .enter { animation: rise 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
